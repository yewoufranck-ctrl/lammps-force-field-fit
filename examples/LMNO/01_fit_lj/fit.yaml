# ================================================================
# Example 01 — Fit epsilon and sigma 
# System: LiMn1.5Ni0.5O4 spinel
# ================================================================

name: "LiMn1.5Ni0.5O4"

lammps:
  input_file:     "lammps.in"
  potential_file: "potential.inp"
  data_file:      "structure.lmp"

# ----------------------------------------------------------------
# Species definition
#
# The order here sets the LAMMPS type numbers (type 1, 2, 3 …).
# The symbol MUST match the ${NAME} variables in potential.inp.
# ----------------------------------------------------------------
species:
  - symbol: Li    # type  1
    mass: 6.940
    element: Li
  - symbol: Ni   # type  2
    mass: 58.690
    element: Ni
  - symbol: Mn   # type  3
    mass: 54.940
    element: Mn
  - symbol: O1    # type  4
    mass: 16.000
    element: O
  - symbol: O2    # type  5
    mass: 16.000
    element: O

# ----------------------------------------------------------------
# Active interactions
# ----------------------------------------------------------------
potential:
  lj:       true
  coulomb:  true
  harmonic: false

  cutoff_lj:      12.5
  cutoff_coulomb: 12.5


structures:

  - name:      "Li1"
    directory: "base_Li1"
    role:      "base"
    can_relax: false
    reference:
      energy:  -402.26441842   # DFT total energy (eV)
      lattice:    8.206762      # DFT relaxed lattice parameter (Å)
    weights:
      energy:     1.0
      lattice:  500.0
      forces:     1.0
      coordinates: 1.0

  - name:      "replica_01"
    directory: "replica_01"
    role:      "replica"
    base:      "Li1"
    reference:
      energy:  -401.21424865
    weights:
      energy:  1.0
      forces:  1.0

  - name:      "replica_02"
    directory: "replica_02"
    role:      "replica"
    base:      "Li1"
    reference:
      energy:  -400.46365967
    weights:
      energy:  1.0
      forces:  1.0

# ----------------------------------------------------------------
# Fitting parameters
# ----------------------------------------------------------------
fitting:

  # ---- Energy shift ----
  shift:
    fit:    true
    bounds: [-500.0, 500.0]

  # ---- Lennard-Jones pair parameters ----
  lj_pairs:

    # Fit BOTH epsilon and sigma for Mn-O1
    - types: [Mn, O1]
      fit:   true
      bounds:
        epsilon: [1.0e-7, 1.0e-1]
        sigma:   [2.0, 5.5]

    # Fit BOTH epsilon and sigma for Mn-O2
    - types: [Mn, O2]
      fit:   true
      bounds:
        epsilon: [1.0e-7, 1.0e-1]
        sigma:   [2.0, 5.5]

    # Fit only epsilon for Ni-O2, keep sigma fixed
    - types:        [Ni, O2]
      fit_epsilon:  true
      fit_sigma:    false
      bounds:
        epsilon: [1.0e-7, 1.0e-1]

  # ---- Charges ----
  # Requires optimizer.method: trust-constr (or SLSQP).
  charges:

    - type:   O1
      fit:    false
      bounds: [-2.5, -0.4]
      # electroneutral_with: "Li1"

    - type:   O2
      fit:    false
      bounds: [-2.5, -0.4]
      # electroneutral_with: "Li1"

    - type:   Ni
      fit:    false
      bounds: [0.8, 2.0]
      # electroneutral_with: "Li1"

  # ---- Optimizer ----
  optimizer:
    method:          "L-BFGS-B"   # L-BFGS-B | Nelder-Mead | TNC | SLSQP | trust-constr
    max_iter:        2000
    tolerance:       1.0e-8
    save_every:      20
    perturb_initial: 0.0
    relax_maxiter:   500          # LAMMPS minimisation steps for can_relax: true structures
